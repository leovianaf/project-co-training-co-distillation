[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "project_co_training_co_distillation"
version = "0.0.1"
description = "A replication study of the paper 'Co-training and Co-distillation for Quality Improvement and Compression of Language Models'."
authors = [
  { name = "Beatriz Silva \u0026 Leonardo Viana" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.11.5"


[tool.ruff]
line-length = 99
src = ["project_co_training_co_distillation"]
include = ["pyproject.toml", "project_co_training_co_distillation/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["project_co_training_co_distillation"]
force-sort-within-sections = true

